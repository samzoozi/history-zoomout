services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: historyrewind
      POSTGRES_PASSWORD: historyrewind
      POSTGRES_DB: historyrewind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U historyrewind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
