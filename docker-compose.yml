services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: history_zoomout
      POSTGRES_PASSWORD: history_zoomout
      POSTGRES_DB: history_zoomout
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U history_zoomout"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
