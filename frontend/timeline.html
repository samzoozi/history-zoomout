<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>History Zoomout — Interface Concept</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="timeline.css" />
</head>
<body>
  <div class="app">
    <div class="nav-scrim" id="navScrim"></div>
    <nav class="nav-drawer" id="navDrawer" aria-label="Browse categories">
      <div class="nav-drawer-header">
        <span class="nav-drawer-title">Browse</span>
        <button class="nav-drawer-close" id="navClose" aria-label="Close menu">✕</button>
      </div>
      <div class="nav-drawer-list" id="navList"></div>
      <div class="nav-drawer-footer">
        <a class="nav-drawer-about-link" href="about.html">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="14" height="14">
            <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2" />
            <path d="M8 7.2V11.3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
            <circle cx="8" cy="5.1" r="0.75" fill="currentColor" />
          </svg>
          <span>About</span>
        </a>
      </div>
    </nav>
    <header class="topbar">
      <div class="brand-row">
        <button type="button" class="nav-toggle" id="navToggle" aria-haspopup="true" aria-expanded="false" aria-controls="navDrawer" aria-label="Browse categories">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3 5.5H17" stroke="var(--brass)" stroke-width="2" stroke-linecap="round" />
            <path d="M3 10H17" stroke="var(--brass)" stroke-width="2" stroke-linecap="round" />
            <path d="M3 14.5H17" stroke="var(--brass)" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div class="brand-block">
          <a class="wordmark" href="timeline.html">
            <span>History</span><span class="accent">Zoomout</span>
            <svg class="wordmark-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
              <!-- lens ring doubles as a compass rose; diamond points + N/E/S/W labels frame it -->
              <circle cx="16" cy="16" r="8" stroke="var(--brass)" stroke-width="1.3" />
              <path d="M16 6.2 L17.3 8 L16 9.8 L14.7 8 Z" fill="var(--brass)" />
              <path d="M25.8 16 L24 17.3 L22.2 16 L24 14.7 Z" fill="var(--brass)" />
              <path d="M16 25.8 L17.3 24 L16 22.2 L14.7 24 Z" fill="var(--brass)" />
              <path d="M6.2 16 L8 17.3 L9.8 16 L8 14.7 Z" fill="var(--brass)" />
              <text x="16" y="4" text-anchor="middle" dominant-baseline="central" font-family="Marcellus, serif" font-size="6" fill="var(--brass)">N</text>
              <text x="28" y="16" text-anchor="middle" dominant-baseline="central" font-family="Marcellus, serif" font-size="6" fill="var(--brass)">E</text>
              <text x="16" y="28" text-anchor="middle" dominant-baseline="central" font-family="Marcellus, serif" font-size="6" fill="var(--brass)">S</text>
              <text x="4" y="16" text-anchor="middle" dominant-baseline="central" font-family="Marcellus, serif" font-size="6" fill="var(--brass)">W</text>
              <!-- zoom-out minus sign -->
              <line x1="12.5" y1="16" x2="19.5" y2="16" stroke="var(--brass)" stroke-width="1.8" stroke-linecap="round" />
              <!-- magnifying-glass handle -->
              <line x1="21.7" y1="21.7" x2="30.7" y2="30.7" stroke="var(--brass)" stroke-width="2.4" stroke-linecap="round" />
            </svg>
          </a>
        </div>
      </div>
      <div class="controls">
        <div class="control-row">
          <div class="zoom-control">
            <label for="zoom">Scale</label>
            <input type="range" id="zoom" min="0.6" max="4" step="0.1" value="1" />
            <span class="zoom-readout" id="zoomReadout">100%</span>
          </div>
          <div class="tag-filter">
            <button type="button" class="tag-filter-toggle" id="tagFilterToggle" aria-haspopup="true" aria-expanded="false">
              <svg class="tag-filter-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M2 2H7.17C7.70 2 8.22 2.21 8.59 2.59L13.4 7.4C14.2 8.2 14.2 9.5 13.4 10.3L10.3 13.4C9.5 14.2 8.2 14.2 7.4 13.4L2.59 8.59C2.21 8.22 2 7.70 2 7.17V2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
                <circle cx="5" cy="5" r="1" fill="currentColor" />
              </svg>
              <span id="tagFilterLabel">Tags</span>
              <svg class="chev" viewBox="0 0 10 6" fill="none" aria-hidden="true">
                <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <div class="tag-filter-panel" id="tagFilterPanel" hidden>
              <div class="topic-filter-actions">
                <button type="button" id="tagFilterClearBtn">Clear</button>
              </div>
              <div class="topic-filter-list" id="tagFilterList"></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="load-state" id="loadState" role="status">Loading timeline…</div>

    <div class="stage" id="stage" hidden>
      <div class="scroller" id="scroller">
        <div class="track" id="track">
          <div class="axis-row">
            <div class="axis-spacer"></div>
            <div class="axis-track" id="axisTrack"></div>
          </div>
          <div class="era-overlay" id="eraOverlay"></div>
          <div id="lanes"></div>
        </div>
      </div>

      <div class="scroll-hint" id="scrollHint" aria-hidden="true">
        <span class="scroll-hint-arrow">›</span>
      </div>

      <aside class="detail-panel" id="detailPanel">
        <div class="drag-handle"></div>
        <button class="detail-close" id="detailClose">Close ✕</button>
        <div class="detail-content" id="detailContent">
          <div class="detail-eyebrow" id="detailEyebrow"><span class="dot"></span><span id="detailTopic"></span><span class="date" id="detailDate"></span></div>
          <h2 class="detail-title" id="detailTitle"></h2>
          <div class="detail-tags" id="detailTags"></div>
          <figure class="detail-figure" id="detailFigure" hidden>
            <img class="detail-image" id="detailImage" alt="" />
            <figcaption class="detail-image-caption" id="detailImageCaption"></figcaption>
          </figure>
          <div class="detail-rule"></div>
          <p class="detail-body" id="detailBody"></p>
          <div class="detail-footer">
            <a class="detail-source-link" id="detailSourceLink" href="#" target="_blank" rel="noopener noreferrer" hidden>Read on Wikipedia ↗</a>
          </div>
          <div class="detail-map" id="detailMap" hidden>
            <div class="detail-map-svg" id="detailMapSvg"></div>
            <span class="detail-map-dot" id="detailMapDot" hidden></span>
            <div class="detail-map-caption" id="detailMapCaption">
              <span class="detail-map-caption-historical" id="detailMapCaptionHistorical"></span>
              <span class="detail-map-caption-modern" id="detailMapCaptionModern"></span>
            </div>
          </div>
        </div>
        <div class="detail-scroll-fade" id="detailScrollFade" aria-hidden="true"></div>
      </aside>
    </div>

    <footer class="note">Interface concept for History Zoomout — dates approximate, for illustration only.</footer>
  </div>

  <script src="config.js"></script>
  <script src="timeline.js"></script>
</body>
</html>
