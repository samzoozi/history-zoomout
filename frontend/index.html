<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>History Zoomout</title>
<link rel="stylesheet" href="timeline.css" />
<link rel="stylesheet" href="landing.css" />
</head>
<body class="landing-body">
  <div class="app">
    <header class="topbar">
      <div class="brand-block">
        <div class="wordmark">
          <svg class="wordmark-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <!-- lens ring doubles as a compass rose; diamond points + N/E/S/W labels frame it -->
            <circle cx="16" cy="16" r="8" stroke="var(--brass)" stroke-width="1.3" />
            <path d="M16 6.2 L17.3 8 L16 9.8 L14.7 8 Z" fill="var(--brass)" />
            <path d="M25.8 16 L24 17.3 L22.2 16 L24 14.7 Z" fill="var(--brass)" />
            <path d="M16 25.8 L17.3 24 L16 22.2 L14.7 24 Z" fill="var(--brass)" />
            <path d="M6.2 16 L8 17.3 L9.8 16 L8 14.7 Z" fill="var(--brass)" />
            <text x="16" y="4" text-anchor="middle" dominant-baseline="central" font-family="Marcellus, serif" font-size="6" fill="var(--brass)">N</text>
            <text x="28" y="16" text-anchor="middle" dominant-baseline="central" font-family="Marcellus, serif" font-size="6" fill="var(--brass)">E</text>
            <text x="16" y="28" text-anchor="middle" dominant-baseline="central" font-family="Marcellus, serif" font-size="6" fill="var(--brass)">S</text>
            <text x="4" y="16" text-anchor="middle" dominant-baseline="central" font-family="Marcellus, serif" font-size="6" fill="var(--brass)">W</text>
            <!-- zoom-out minus sign -->
            <line x1="12.5" y1="16" x2="19.5" y2="16" stroke="var(--brass)" stroke-width="1.8" stroke-linecap="round" />
            <!-- magnifying-glass handle -->
            <line x1="21.7" y1="21.7" x2="30.7" y2="30.7" stroke="var(--brass)" stroke-width="2.4" stroke-linecap="round" />
          </svg>
          <span>History</span><span class="accent">Zoomout</span>
        </div>
      </div>
    </header>

    <main class="landing-main">
      <p class="landing-tagline">Pick a history to zoom through.</p>

      <div class="load-state" id="loadState" role="status">Loading categories…</div>

      <div class="category-grid" id="categoryGrid" hidden></div>
    </main>

    <footer class="note">Interface concept for History Zoomout — dates approximate, for illustration only.</footer>
  </div>

  <script src="landing.js"></script>
</body>
</html>
