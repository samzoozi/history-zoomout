<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>History Zoomout — Interface Concept</title>
<link rel="stylesheet" href="timeline.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-block">
        <div class="wordmark"><span>History</span><span class="accent">Zoomout</span></div>
      </div>
      <div class="controls">
        <div class="control-row">
          <div class="civ-filter" id="civFilter">
            <button type="button" class="civ-filter-toggle" id="civFilterToggle" aria-haspopup="true" aria-expanded="false">
              Civilizations <span id="civFilterCount">—</span>
            </button>
            <div class="civ-filter-panel" id="civFilterPanel" hidden>
              <div class="civ-filter-actions">
                <button type="button" id="civFilterAll">Select all</button>
                <button type="button" id="civFilterClear">Clear</button>
              </div>
              <div class="civ-filter-list" id="civFilterList"></div>
            </div>
          </div>
          <div class="segmented" role="group" aria-label="Event significance">
            <button type="button" data-sig="major" aria-pressed="true">Landmark events</button>
            <button type="button" data-sig="all" aria-pressed="false">All events</button>
          </div>
          <div class="zoom-control">
            <label for="zoom">Scale</label>
            <input type="range" id="zoom" min="0.6" max="4" step="0.1" value="1" />
            <span class="zoom-readout" id="zoomReadout">100%</span>
          </div>
        </div>
        <div class="control-row era-chips" id="eraChips"></div>
      </div>
    </header>

    <div class="load-state" id="loadState" role="status">Loading timeline…</div>

    <div class="stage" id="stage" hidden>
      <div class="scroller" id="scroller">
        <div class="track" id="track">
          <div class="axis-row">
            <div class="axis-spacer"></div>
            <div class="axis-track" id="axisTrack"></div>
          </div>
          <div class="era-overlay" id="eraOverlay"></div>
          <div id="lanes"></div>
        </div>
      </div>

      <aside class="detail-panel" id="detailPanel">
        <div class="drag-handle"></div>
        <button class="detail-close" id="detailClose">Close ✕</button>
        <div class="detail-empty" id="detailEmpty">
          <svg width="72" height="72" viewBox="0 0 72 72" fill="none" aria-hidden="true">
            <circle cx="36" cy="36" r="30" stroke="var(--hairline-strong)" stroke-width="1"/>
            <circle cx="36" cy="36" r="21" stroke="var(--hairline-strong)" stroke-width="1"/>
            <circle cx="36" cy="36" r="2.5" fill="var(--brass)"/>
            <line x1="36" y1="3" x2="36" y2="11" stroke="var(--brass)" stroke-width="1.4"/>
            <line x1="36" y1="61" x2="36" y2="69" stroke="var(--hairline-strong)" stroke-width="1.4"/>
            <line x1="3" y1="36" x2="11" y2="36" stroke="var(--hairline-strong)" stroke-width="1.4"/>
            <line x1="61" y1="36" x2="69" y2="36" stroke="var(--hairline-strong)" stroke-width="1.4"/>
            <line x1="36" y1="36" x2="53" y2="21" stroke="var(--brass)" stroke-width="1.4"/>
          </svg>
          <p>Select a mark on the timeline to read its record.</p>
          <span class="hint"><span id="eventCount2">—</span> events · 3200 BCE – 1600 CE</span>
        </div>
        <div class="detail-content" id="detailContent">
          <div class="detail-eyebrow" id="detailEyebrow"><span class="dot"></span><span id="detailCiv"></span><span class="date" id="detailDate"></span></div>
          <h2 class="detail-title" id="detailTitle"></h2>
          <div class="detail-rule"></div>
          <p class="detail-body" id="detailBody"></p>
          <span class="detail-tag" id="detailTag"></span>
        </div>
      </aside>
    </div>

    <footer class="note">Interface concept for History Zoomout — dates approximate, for illustration only.</footer>
  </div>

  <script src="timeline.js"></script>
</body>
</html>
